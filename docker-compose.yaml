services:
  postgres:
    image: postgres:latest
    container_name: bank-postgres
    networks:
      - bank-network
    ports:
      - "5431:5432"
    environment:
      POSTGRES_DB: "postgres"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    volumes:
      - bank-data:/data/postgres

  kafka:
    image: apache/kafka:latest
    container_name: bank-kafka
    networks:
      - bank-network
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://bank-kafka:9092,EXTERNAL://localhost:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_CREATE_TOPICS: >
        CheckClosedEvent:1:1,
    volumes:
      - bank-checks-kafka-data:/kafka-data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: bank-kafka-ui
    networks:
      - bank-network
    build:
      context: .
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8082:8080"
    volumes:
      - ./src/BankingServiceProject/Protos:/schemas
    environment:
      kafka.clusters.0.name: bank-kafka
      kafka.clusters.0.bootstrapServers: bank-kafka:9092
      kafka.clusters.0.defaultKeySerde: ProtobufFile
      kafka.clusters.0.defaultValueSerde: ProtobufFile
      
      kafka.clusters.0.serde.0.name: ProtobufFile
      kafka.clusters.0.serde.0.properties.protobufFilesDir: /schemas/
      
      kafka.clusters.0.serde.0.properties.protobufMessageNameForKeyByTopic.CheckClosedEvent: grpc_banking_service.kafka.ClosedCheckKey
      kafka.clusters.0.serde.0.properties.protobufMessageNameForValueByTopic.CheckClosedEvent: grpc_banking_service.kafka.ClosedCheckValue

networks:
  bank-network:
    driver: bridge

volumes:
  bank-checks-kafka-data:
  bank-data: